<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REFLOW ORBIT (beta)</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#18063c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Syncopate:wght@400;700&family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
:root{
  --night:#100428; --navy:#18063c;
  --cyan:#17b3e8; --blue:#2d5be3;
  --paper:#ffffff; --mist:#f4f3f8; --ink:#1d1838; --muted:#6a6684; --hair:#e6e3f0;
  --s-rosso:#e5383b; --s-giallo:#f2a900; --s-verde:#2bb673; --s-grigio:#9a96b0; --s-spento:#6f7fa8; --s-nd:#c4c0d4;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-sheet:16px; --r-ctl:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font:14px/1.45 var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- barra superiore ---------- */
header{position:relative;z-index:10;display:flex;align-items:center;gap:18px;min-height:62px;padding:10px 18px;color:#fff;background:linear-gradient(180deg,#1a0a40,#120531);border-bottom:1px solid rgba(23,179,232,.35)}
.brandlink{border:0;padding:0;background:none;cursor:pointer;display:block}
.brand{height:26px;width:auto;display:block;opacity:.96}
.hsep{width:1px;height:28px;background:rgba(255,255,255,.16)}
.back{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#e8e5f7;font-size:13px;font-weight:500;cursor:pointer}
.back:hover{background:rgba(255,255,255,.1)}
h1{margin:0;min-width:0;display:flex;flex-direction:column;gap:1px}
h1 .kick{font-size:12px;font-weight:500;color:#a99fd6}
h1 #hname{font-size:17px;font-weight:600;letter-spacing:-.015em;color:#fff;white-space:nowrap}
h1 small{font-size:11.5px;color:rgba(232,229,247,.55);white-space:nowrap}
.kpis{margin-left:auto;display:flex;padding:4px;gap:2px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.kpi{display:flex;flex-direction:column;align-items:flex-start;min-width:92px;padding:5px 12px 6px;border:0;border-radius:10px;background:transparent;color:#d9d4f0;cursor:pointer;text-align:left}
.kpi:hover{background:rgba(255,255,255,.07)}
.kpi b{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi b i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.kpi span{font-size:11px;color:#a99fd6}
.kpi[aria-pressed="true"]{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.kpi[aria-pressed="true"] b{color:var(--navy)}
.kpi[aria-pressed="true"] span{color:var(--muted)}
#b-out{flex:none}

/* ---------- schermata iniziale ---------- */
#splash{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto 1fr auto;padding:28px 40px;color:#fff;overflow:hidden;
  background:radial-gradient(1100px 620px at 78% 62%,rgba(45,91,227,.30),transparent 65%),radial-gradient(700px 420px at 8% 108%,rgba(23,179,232,.16),transparent 70%),linear-gradient(160deg,#1b0a45,#0f0326 72%)}
.sp-logo{height:30px;width:auto;position:relative;z-index:1}
.sp-art{position:absolute;inset:0;pointer-events:none;opacity:0;animation:spIn 1.4s .15s ease-out forwards}
.sp-art svg{width:100%;height:100%;display:block}
.sp-sat{transform-origin:600px 400px;animation:orb 60s linear infinite}
@keyframes spIn{to{opacity:1}}
@keyframes orb{to{transform:rotate(360deg)}}
.sp-in{position:relative;z-index:1;align-self:center;justify-self:center;text-align:center;display:flex;flex-direction:column;align-items:center}
.sp-in::before{content:'';position:absolute;inset:-90px -140px;z-index:-1;background:radial-gradient(closest-side,rgba(18,5,48,.85),transparent);pointer-events:none}
.sp-title{margin:0;font-family:"Syncopate","Inter",sans-serif;font-weight:400;font-size:clamp(22px,6.2vw,84px);line-height:1;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:#fff;text-shadow:0 2px 30px rgba(10,2,30,.6)}
.sp-title .sp-o{color:var(--cyan)}
.sp-in p{margin:30px 0 40px;font-family:"Syncopate","Inter",sans-serif;font-size:clamp(9.5px,.95vw,13px);letter-spacing:.22em;text-transform:uppercase;line-height:2.2;color:#d9d3f3}
.sp-go{display:inline-flex;align-items:center;gap:14px;height:52px;padding:0 28px 0 32px;font:700 14px "Syncopate","Inter",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--navy);background:#fff;border:0;border-radius:999px;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.sp-go svg{width:18px;height:18px}
.sp-foot{position:relative;z-index:1;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:rgba(232,229,247,.5)}

/* ---------- elenco ---------- */
#home{flex:1;overflow:auto;background:var(--mist)}
.hero{background:#fff;border-bottom:1px solid var(--hair);padding:30px 24px 24px}
.hero-in,.home-in{max-width:1180px;margin:0 auto}
.hero h2{margin:0;font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.03em;color:var(--navy)}
.hero p{margin:6px 0 0;max-width:70ch;color:var(--muted);line-height:1.55}
.hero-row{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.search{position:relative;width:280px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input,.sel{width:100%;height:42px;padding:0 14px 0 36px;font:14px var(--font);color:var(--ink);background:var(--mist);border:1px solid var(--hair);border-radius:12px}
.sel{width:auto;padding:0 12px;min-width:170px}
.search input:focus,.sel:focus{outline:none;border-color:var(--cyan);background:#fff}
.home-in{padding:26px 24px 56px;display:grid;gap:32px}
.cliente{display:grid;gap:14px}
.cliente-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--hair);padding-bottom:10px}
.cliente-h h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.cliente-h span{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);min-width:0;gap:0;padding:0;overflow:hidden;text-align:left;color:inherit;background:var(--paper);border:1px solid var(--hair);border-radius:14px;cursor:pointer;box-shadow:0 1px 2px rgba(24,6,60,.05);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(24,6,60,.12)}
.thumb{position:relative;background:#1d1446 center/cover no-repeat;min-height:112px}
.thumb::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.cbody{padding:11px 13px 10px;display:grid;gap:5px;min-width:0}
.cname{font-weight:600;font-size:14px;color:var(--navy);line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cmeta{font-size:12px;color:var(--muted)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fff;background:var(--c);white-space:nowrap}
.pill.light{background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 70%,#1d1838)}
.spark{width:110px;height:26px}
.cnum{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.crow>div{display:flex;align-items:center;gap:6px;min-width:0}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- scheda impianto ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,4,40,.5);display:grid;place-items:center;padding:20px;overflow:auto}
.sheet{position:relative;width:min(1040px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px 24px 24px;background:#fff;border-radius:var(--r-sheet);box-shadow:0 24px 60px rgba(10,2,30,.35)}
.sheet h2{margin:0 40px 2px 0;font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.sheet .sub{color:var(--muted);font-size:13px}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:#fff;cursor:pointer;font-size:18px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;margin-top:16px}
.sat{position:relative;border-radius:12px;overflow:hidden;background:#1d1446;aspect-ratio:1}
.sat img,.sat svg{position:absolute;inset:0;width:100%;height:100%}
.sat .cap{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(16,4,40,.6);padding:2px 7px;border-radius:6px}
.stato{border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
.stato b{font-size:16px;color:color-mix(in srgb,var(--c) 75%,#1d1838)}
.stato p{margin:3px 0 0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.st{background:var(--mist);border-radius:10px;padding:8px 11px}
.st span{display:block;font-size:11px;color:var(--muted)}
.st b{font:500 15px var(--mono);color:var(--navy)}
.chart{margin-top:16px;border:1px solid var(--hair);border-radius:12px;padding:10px 10px 4px}
.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:2px 6px 6px}
.leg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
h4{margin:18px 0 6px;font-size:13px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:5px 8px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;font:500 13px var(--font);color:var(--ink);background:#fff;border:1px solid var(--hair);border-radius:var(--r-ctl);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}

@media (max-width:820px){
  #splash{padding:22px}
  header{flex-wrap:wrap;gap:10px}
  .kpis{margin-left:0;width:100%;overflow-x:auto}
  .kpi{min-width:84px}
  h1 small{display:none}
  #b-out{position:absolute;top:12px;right:12px;height:32px}
  .grid2{grid-template-columns:1fr}
  .search{width:100%}
  .sheet{padding:18px 14px}
  .card{grid-template-columns:76px minmax(0,1fr)}
  .spark{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.sp-art{opacity:.6}}
</style>
</head>
<body>
<header>
  <button class="brandlink" id="b-start" title="Schermata iniziale"><img class="brand" alt="Reflow Maintenance Service" src="assets/logo_w.png"></button>
  <span class="hsep" aria-hidden="true"></span>
  <h1><span class="kick">REFLOW ORBIT</span><span id="hname">Erba negli impianti a terra</span>
    <small id="hsub">Monitoraggio satellitare Sentinel-2</small></h1>
  <div class="kpis" id="kpis" aria-label="Filtra per stato">
    <button class="kpi" data-f="" aria-pressed="true"><b id="k-tot">0</b><span>impianti</span></button>
    <button class="kpi" data-f="rosso" aria-pressed="false" style="--c:var(--s-rosso)"><b><i></i><em id="k-rosso" style="font-style:normal">0</em></b><span>da tagliare</span></button>
    <button class="kpi" data-f="giallo" aria-pressed="false" style="--c:var(--s-giallo)"><b><i></i><em id="k-giallo" style="font-style:normal">0</em></b><span>da programmare</span></button>
    <button class="kpi" data-f="verde" aria-pressed="false" style="--c:var(--s-verde)"><b><i></i><em id="k-verde" style="font-style:normal">0</em></b><span>in ordine</span></button>
    <button class="kpi" data-f="altro" aria-pressed="false" style="--c:var(--s-grigio)"><b><i></i><em id="k-altro" style="font-style:normal">0</em></b><span>senza avviso</span></button>
  </div>
  <button class="back" id="b-out" title="Esci dall'account Microsoft">Esci</button>
</header>

<section id="splash">
  <img class="sp-logo" alt="Reflow Maintenance Service" src="assets/logo_w.png">
  <div class="sp-art" aria-hidden="true"><svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="rgba(23,179,232,.22)" stroke-width="1.2">
      <ellipse cx="600" cy="400" rx="520" ry="190" transform="rotate(-14 600 400)"/>
      <ellipse cx="600" cy="400" rx="400" ry="140" transform="rotate(-14 600 400)" stroke="rgba(185,175,240,.16)"/>
      <ellipse cx="600" cy="400" rx="640" ry="250" transform="rotate(-14 600 400)" stroke="rgba(185,175,240,.10)"/>
    </g>
    <g class="sp-sat"><circle cx="1120" cy="400" r="5" fill="#17b3e8"/><circle cx="1120" cy="400" r="14" fill="none" stroke="rgba(23,179,232,.35)"/></g>
  </svg></div>
  <div class="sp-in">
    <h2 class="sp-title" aria-label="REFLOW ORBIT">REFLOW <span class="sp-o">ORBIT</span></h2>
    <p>Monitoraggio satellitare dell'erba – Impianti a terra:<br>sfalci da programmare, andamento del verde</p>
    <button class="sp-go" id="b-enter">Impianti<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
  </div>
  <div class="sp-foot"><span>Reflow S.r.l., gruppo ESPE · dati Copernicus Sentinel-2</span><span id="sp-count"></span></div>
</section>

<section id="home" hidden>
  <div class="hero"><div class="hero-in hero-row">
    <div><h2>Impianti a terra</h2><p id="home-sub"></p></div>
    <div class="tools">
      <select class="sel" id="fpm" aria-label="Filtra per PM"><option value="">Tutti i PM</option></select>
      <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg><input type="search" id="hq" placeholder="Cerca cliente o impianto" aria-label="Cerca cliente o impianto"></label>
    </div>
  </div></div>
  <div class="home-in" id="clienti"></div>
</section>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="cloud.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEM={rosso:['Da tagliare','var(--s-rosso)'],giallo:['Da programmare','var(--s-giallo)'],verde:['In ordine','var(--s-verde)'],
  grigio:['Senza immagine recente','var(--s-grigio)'],spento:['Fuori stagione','var(--s-spento)'],nd:['Area da definire','var(--s-nd)']};
const ORD={rosso:0,giallo:1,verde:2,grigio:3,spento:4,nd:5};
const num=(v,d=2)=>v==null?'–':Number(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const dIT=s=>s?new Date(s+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
let D=null, F={sem:'',pm:'',q:''};

const sem=i=>i.stato?.semaforo||'nd';
const gruppo=s=>['rosso','giallo','verde'].includes(s)?s:'altro';

function pill(s,light){const [t,c]=SEM[s]||SEM.nd;return `<span class="pill${light?' light':''}" style="--c:${c}">${esc(t)}</span>`;}

function spark(serie){
  if(!serie||serie.length<2)return '';
  const pts=serie.slice(-60), t0=+new Date(pts[0][0]), t1=+new Date(pts[pts.length-1][0])||t0+1;
  const ys=pts.map(p=>p[1]), lo=Math.min(...ys), hi=Math.max(...ys)||lo+.1;
  const xy=pts.map(p=>[(+new Date(p[0])-t0)/(t1-t0||1)*108+1,24-(p[1]-lo)/((hi-lo)||1)*22]);
  return `<svg class="spark" viewBox="0 0 110 26"><polyline fill="none" stroke="#2d5be3" stroke-width="1.6" stroke-linejoin="round" points="${xy.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/></svg>`;
}

function riga(i){
  const st=i.stato||{};const s=sem(i);
  if(s==='spento'&&st.fine_stagione){const f=st.fine_stagione.semaforo;return `${pill(s,true)} <span class="cnum">a fine stagione: ${esc((SEM[f]||SEM.nd)[0].toLowerCase())}</span>`;}
  let t='';
  if(st.ndvi!=null)t+=`NDVI ${num(st.ndvi)}`;
  if(st.giorni_alla_soglia!=null&&s!=='rosso')t+=` · soglia ~${st.giorni_alla_soglia} gg`;
  return `${pill(s)} <span class="cnum">${t}</span>`;
}

function filtra(){
  return D.impianti.filter(i=>{
    if(F.sem&&gruppo(sem(i))!==F.sem)return false;
    if(F.pm&&i.pm!==F.pm&&i.pm2!==F.pm)return false;
    if(F.q){const q=F.q.toLowerCase();if(!(`${i.nome} ${i.cliente} ${i.regione}`.toLowerCase().includes(q)))return false;}
    return true;});
}

function contatori(){
  const base=D.impianti.filter(i=>!F.pm||i.pm===F.pm||i.pm2===F.pm);
  $('k-tot').textContent=base.length;
  for(const g of ['rosso','giallo','verde','altro'])$('k-'+g).textContent=base.filter(i=>gruppo(sem(i))===g).length;
  document.querySelectorAll('.kpi').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===F.sem)));
}

function elenco(){
  contatori();
  const L=filtra(), per={};
  L.forEach(i=>(per[i.cliente||'—']=per[i.cliente||'—']||[]).push(i));
  const cl=Object.keys(per).sort((a,b)=>a.localeCompare(b,'it'));
  $('clienti').innerHTML=cl.length?cl.map(c=>{
    const v=per[c].sort((a,b)=>(ORD[sem(a)]-ORD[sem(b)])||a.nome.localeCompare(b.nome,'it'));
    return `<section class="cliente"><div class="cliente-h"><h3>${esc(c)}</h3><span>${v.length} ${v.length===1?'impianto':'impianti'}</span></div>
      <div class="cards">${v.map(i=>`<button class="card" data-id="${esc(i.id)}">
        <div class="thumb" data-img="${esc(i.immagine||'')}" style="--c:${(SEM[sem(i)]||SEM.nd)[1]}"></div>
        <div class="cbody"><div class="cname">${esc(i.nome)}</div>
          <div class="cmeta">${esc(i.regione||'')}${i.pm?' · PM '+esc(i.pm):''}</div>
          <div class="crow"><div>${riga(i)}</div>${spark(i.serie)}</div></div></button>`).join('')}</div></section>`;}).join('')
    :'<div class="empty">Nessun impianto con questi filtri.</div>';
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{location.hash='impianto/'+b.dataset.id;});
  carica_miniature();
}

const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);mostra_img(e.target);}}),{rootMargin:'200px'}):null;
function carica_miniature(){document.querySelectorAll('.thumb[data-img]').forEach(t=>{if(!t.dataset.img)return;io?io.observe(t):mostra_img(t);});}
async function mostra_img(t){const u=await ORBIT.imgURL('dati/'+t.dataset.img);if(u)t.style.backgroundImage=`url("${u}")`;}

function poligono(g,bb){
  if(!g||!bb)return '';
  const [x0,y0,x1,y1]=bb, P=c=>`${((c[0]-x0)/(x1-x0)*512).toFixed(1)},${((y1-c[1])/(y1-y0)*512).toFixed(1)}`;
  const polys=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];
  return polys.map(p=>p.map(r=>`<polygon points="${r.map(P).join(' ')}" fill="rgba(23,179,232,.10)" stroke="#17b3e8" stroke-width="2.2" stroke-linejoin="round"/>`).join('')).join('');
}

function grafico(i){
  const S=i.serie||[];if(S.length<2)return '<p class="note">Serie non disponibile.</p>';
  const st=Object.assign({},i.stato,i.stato?.semaforo==='spento'&&i.stato.fine_stagione?{soglia_gialla:i.stato.fine_stagione.soglia_gialla}:{}), W=720,H=250,L=40,R=12,T=12,B=28;
  const t0=+new Date(S[0][0]), t1=+new Date(S[S.length-1][0]);
  const vals=S.map(p=>p[1]).concat([st.riferimento,st.soglia_gialla].filter(v=>v!=null));
  const lo=Math.max(-.1,Math.floor((Math.min(...vals)-.05)*10)/10), hi=Math.min(1,Math.ceil((Math.max(...vals)+.05)*10)/10);
  const X=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=.1){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eeecf5"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#6a6684">${num(v,1)}</text>`;}
  const d=new Date(t0);d.setDate(1);d.setMonth(d.getMonth()+1);
  while(+d<=t1){const x=X(+d);g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="#f3f1f8"/>`;
    if(d.getMonth()%2===0)g+=`<text x="${x}" y="${H-B+15}" text-anchor="middle" font-size="10" fill="#6a6684">${d.toLocaleDateString('it-IT',{month:'short'})}${d.getMonth()===0?' '+String(d.getFullYear()).slice(2):''}</text>`;
    d.setMonth(d.getMonth()+1);}
  (i.sfalci||[]).forEach(s=>{const a=+new Date(s.da),b=+new Date(s.a||s.da)+864e5;if(b<t0||a>t1)return;
    const xa=X(Math.max(a,t0)),xb=X(Math.min(b,t1));g+=`<rect x="${xa}" y="${T}" width="${Math.max(3,xb-xa)}" height="${H-T-B}" fill="rgba(43,182,115,.18)"/>`;});
  if(st.riferimento!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(st.riferimento)}" y2="${Y(st.riferimento)}" stroke="#e5383b" stroke-dasharray="5 4" stroke-width="1.4"/>`;
  if(st.soglia_gialla!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(st.soglia_gialla)}" y2="${Y(st.soglia_gialla)}" stroke="#f2a900" stroke-dasharray="5 4" stroke-width="1.4"/>`;
  g+=`<polyline fill="none" stroke="#2d5be3" stroke-width="2" stroke-linejoin="round" points="${S.map(p=>X(+new Date(p[0])).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
  g+=S.map(p=>`<circle cx="${X(+new Date(p[0])).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.2" fill="#2d5be3"><title>${dIT(p[0])}: ${num(p[1])}</title></circle>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del verde">${g}</svg>
    <div class="leg"><span><i style="background:#2d5be3"></i>indice di verde (NDVI), immagini senza nuvole</span>
    ${st.riferimento!=null?'<span><i style="background:#e5383b"></i>livello a cui di solito si taglia</span>':''}
    ${st.soglia_gialla!=null?'<span><i style="background:#f2a900"></i>soglia di avviso</span>':''}
    <span><i style="background:rgba(43,182,115,.45);height:10px"></i>sfalcio documentato</span></div></div>`;
}

async function scheda(id){
  const i=D.impianti.find(x=>x.id===id);if(!i){location.hash='impianti';return;}
  const st=i.stato||{}, s=sem(i), c=(SEM[s]||SEM.nd)[1];
  const fs=st.fine_stagione;
  const box=x=>x.v==null?'':`<div class="st"><span>${x.k}</span><b>${x.v}</b></div>`;
  const ref=fs&&s==='spento'?fs:st;
  const stats=[{k:'Ultima immagine utile',v:st.data_immagine?dIT(st.data_immagine):null},{k:'NDVI attuale',v:st.ndvi!=null?num(st.ndvi):null},
    {k:'Livello di taglio',v:ref.riferimento!=null?num(ref.riferimento):null},{k:'Soglia di avviso',v:ref.soglia_gialla!=null?num(ref.soglia_gialla):null},
    {k:'Giorni alla soglia',v:st.giorni_alla_soglia!=null?'~'+st.giorni_alla_soglia:null},{k:'Superficie analizzata',v:i.ha_analizzati!=null?num(i.ha_analizzati,1)+' ha':null}].map(box).join('');
  const sat=i.centro?`https://www.bing.com/maps?cp=${i.centro[0]}~${i.centro[1]}&lvl=17&style=h`:null;
  $('sheet').innerHTML=`<button class="x" id="b-x" aria-label="Chiudi">×</button>
    <h2>${esc(i.nome)}</h2><div class="sub">${esc(i.cliente||'')} · ${esc(i.regione||'')}${i.pm?' · PM '+esc(i.pm):''}${i.pm2?' / '+esc(i.pm2):''}</div>
    <div class="grid2"><div>
      <div class="sat">${i.immagine?'<img id="satimg" alt="Immagine satellitare recente">':''}
        <svg viewBox="0 0 512 512" preserveAspectRatio="none">${poligono(i.geometria,i.immagine_bbox)}</svg>
        <span class="cap">Sentinel-2, ultimi 60 giorni${i.immagine_bbox?' · contorno area analizzata':''}</span></div>
      <p class="note">Area: ${esc(i.metodo_area||'–')}${i.affidabilita_area?' · affidabilità '+esc(i.affidabilita_area):''}</p>
    </div><div>
      <div class="stato" style="--c:${c}"><b>${esc((SEM[s]||SEM.nd)[0])}</b><p>${esc(st.motivo||'')}</p>
        ${s==='spento'&&fs?`<p>Al ${dIT(fs.al_giorno)}, ultimo giorno di stagione: <b style="font-size:14px">${esc((SEM[fs.semaforo]||SEM.nd)[0].toLowerCase())}</b> – ${esc(fs.motivo||'')}</p>`:''}
        ${st.fonte_riferimento?`<p class="note" style="margin-top:6px">Livello di taglio da: ${esc(st.fonte_riferimento)}</p>`:''}</div>
      <div class="stats">${stats}</div>
      <div class="acts">${sat?`<a class="btn" href="${sat}" target="_blank" rel="noopener">Satellite</a>`:''}
        ${i.centro?`<a class="btn" href="https://www.google.com/maps/@${i.centro[0]},${i.centro[1]},600m/data=!3m1!1e3" target="_blank" rel="noopener">Google Maps</a>`:''}</div>
    </div></div>
    ${grafico(i)}
    <h4>Sfalci documentati</h4>
    ${(i.sfalci||[]).length?`<table><tr><th>Periodo</th><th>Fonte</th></tr>${i.sfalci.slice().reverse().map(x=>`<tr><td style="white-space:nowrap">${dIT(x.da)}${x.a&&x.a!==x.da?' – '+dIT(x.a):''}</td><td>${esc(x.fonte||'')}</td></tr>`).join('')}</table>`:'<p class="note">Nessuno sfalcio documentato: il livello di taglio è stimato dall\'andamento della stagione.</p>'}
    <p class="note">Indice di verde: valore mediano dei pixel dell'area, solo immagini con almeno l'80% dell'area senza nuvole. Il satellite vede quanto è verde il prato, non l'altezza: d'estate al Sud l'erba secca non si vede, per questo gli avvisi lì sono spenti da giugno a settembre.</p>`;
  $('modal').hidden=false;$('b-x').onclick=()=>history.length>1?history.back():(location.hash='impianti');
  if(i.immagine){const u=await ORBIT.imgURL('dati/'+i.immagine);const im=$('satimg');if(u&&im)im.src=u;}
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const dentro=!!D;
  $('splash').hidden=dentro&&h!=='';
  $('home').hidden=!dentro;
  if(!dentro)return;
  if(h.startsWith('impianto/'))scheda(h.slice(9));else $('modal').hidden=true;
}

$('modal').onclick=e=>{if(e.target.id==='modal')location.hash='impianti';};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)location.hash='impianti';});
$('b-start').onclick=()=>{location.hash='';};
$('b-out').onclick=()=>ORBIT.logout();
document.querySelectorAll('.kpi').forEach(b=>b.onclick=()=>{F.sem=F.sem===b.dataset.f?'':b.dataset.f;elenco();});
$('fpm').onchange=e=>{F.pm=e.target.value;try{localStorage.setItem('orbit-pm',F.pm);}catch(_){}elenco();};
$('hq').oninput=e=>{F.q=e.target.value.trim();elenco();};
window.addEventListener('hashchange',route);

ORBIT.ready.then(async ok=>{
  const b=$('b-enter');
  if(!ok){b.firstChild.textContent='Accedi';b.onclick=()=>ORBIT.login();$('b-out').hidden=true;return;}
  $('sp-count').textContent='Caricamento…';
  D=await ORBIT.getJSON('dati/orbit.json');
  if(!D){$('sp-count').textContent='Dati non ancora disponibili su SharePoint.';D=null;return;}
  const pm=[...new Set(D.impianti.flatMap(i=>[i.pm,i.pm2]).filter(Boolean))].sort();
  $('fpm').innerHTML='<option value="">Tutti i PM</option>'+pm.map(p=>`<option>${esc(p)}</option>`).join('');
  try{const p=localStorage.getItem('orbit-pm');if(p&&pm.includes(p)){F.pm=p;$('fpm').value=p;}}catch(_){}
  const agg=new Date(D.aggiornato);
  $('home-sub').textContent=`${D.impianti.length} impianti con sfalcio previsto. Dati aggiornati al ${agg.toLocaleDateString('it-IT')} ore ${agg.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}. Apri un impianto per l'andamento del verde e l'immagine satellitare.`;
  $('sp-count').textContent=`${D.impianti.length} impianti · aggiornato al ${agg.toLocaleDateString('it-IT')}`;
  b.onclick=()=>{location.hash='impianti';};
  elenco();
  if(location.hash==='')$('splash').hidden=false;
  route();
}).catch(e=>{console.error(e);$('sp-count').textContent='Errore: '+(e&&e.message||e);});
route();
</script>
</body>
</html>
